[package]
name = "orbit-server"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Runs a private Postgres server when DATABASE_URL is not set (desktop and local development).
default = ["embedded"]
embedded = ["dep:postgresql_embedded"]

[[bin]]
name = "orbit-server"
path = "src/main.rs"
required-features = ["embedded"]

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tower-http = { version = "0.7.1", features = ["cors"] }
sha2 = "0.11.1"
hex = "0.4.3"
rand = "0.10.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
include_dir = "0.7.4"
regex = "1.13.1"
postgresql_embedded = { version = "0.22.0", optional = true, default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
